- name: Data types
  hosts: local
  connection: local
  vars:
    course: "devops" # string
    duration: 140.43 # number
    is_live: true # bool
    details: # map
      months: 4
      trainer: siva
    topics: # list
      - Ansible
      - Docker
      - Terraform
  tasks:
    - name: print variables
      ansible.builtin.debug:
        msg: |
          program: {{course}}
          duration: {{duration}}
          isLive: {{is_live}}
          details:{{ details}}
          topics: {{topics}}