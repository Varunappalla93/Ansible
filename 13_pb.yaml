- name: filters/functions
  hosts: local
  connection: local
  become: yes
  vars:
    # greeting: "Good morning"
    topics: linux,shell,docker,terraform
    tagsMap:
      name: "ansible"
      project: "roboshop"
      component: "catalogue"
    tagsList:
       [
        {
            "key": "name",
            "value": "ansible"
        },
        {
            "key": "project",
            "value": "roboshop"
        },
        {
            "key": "component",
            "value": "catalogue"
        }
    ]

  tasks:
    - name: default msg
      ansible.builtin.debug:
        msg: "Hi QA {{ greeting | default('GD MRG') }}"

    - name: convert string to list
      ansible.builtin.debug:
        msg: "{{ topics | split(',') }}"

    
    - name: convert map to list
      ansible.builtin.debug:
        msg: "{{ tagsMap | dict2items }}" # map to list of map

    - name: convert list to map
      ansible.builtin.debug:
        msg: "{{ tagsList | items2dict }}" # list to map